# REFERENCE ONLY: deliberately no secret values and no auth tokens.
# Not included by any Kustomization. Empty data does not make the application runnable.
# Operator provisions these through an approved secret-management workflow.
apiVersion: v1
kind: Secret
metadata:
  name: flyrewheel-runtime
  namespace: flyrewheel
type: Opaque
data: {}
# Required key: DATABASE_URL
# Optional explicit API billing mode only: QE_CODEX_API_KEY (not wired by default)
---
apiVersion: v1
kind: Secret
metadata:
  name: flyrewheel-postgres
  namespace: flyrewheel
type: Opaque
data: {}
# Dev PostgreSQL required key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: flyrewheel-s3
  namespace: flyrewheel
type: Opaque
data: {}
# Dev SeaweedFS required keys: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
# Never place Codex auth.json or copies of an existing login in a Secret.
