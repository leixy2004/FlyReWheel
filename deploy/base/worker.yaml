apiVersion: apps/v1
kind: Deployment
metadata:
  name: flyrewheel-worker
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flyrewheel-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flyrewheel-worker
        app.kubernetes.io/part-of: flyrewheel
    spec:
      serviceAccountName: flyrewheel-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: flyrewheel:dev
          imagePullPolicy: IfNotPresent
          # Registers replay + application queues; application runtime is blocked
          # until reviewed trusted bootstrap dependencies are supplied in code.
          command: [node, dist/worker.js]
          envFrom:
            - configMapRef:
                name: flyrewheel-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flyrewheel-runtime
                  key: DATABASE_URL
          ports:
            - name: health
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/flyrewheel
            - name: codex-home
              mountPath: /codex-home
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: home
          emptyDir:
            sizeLimit: 64Mi
        - name: codex-home
          persistentVolumeClaim:
            claimName: flyrewheel-codex-home
