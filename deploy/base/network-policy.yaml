# Requires a functioning NetworkPolicy controller. These resources do not install one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-to-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flyrewheel-worker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              flyrewheel.io/role: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-health-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flyrewheel-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              flyrewheel.io/health-client: "true"
      ports:
        - protocol: TCP
          port: 8080
