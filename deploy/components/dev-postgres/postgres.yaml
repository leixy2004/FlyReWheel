# Development only: one database instance, no operator, TLS, PITR or automated failover.
apiVersion: v1
kind: Service
metadata:
  name: flyrewheel-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flyrewheel-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flyrewheel-postgres-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flyrewheel-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flyrewheel-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flyrewheel-postgres
        app.kubernetes.io/part-of: flyrewheel
        flyrewheel.io/role: postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.11-bookworm
          imagePullPolicy: IfNotPresent
          args: [postgres, -c, shared_buffers=128MB, -c, max_connections=30]
          env:
            - name: POSTGRES_USER
              value: qual_evo
            - name: POSTGRES_DB
              value: qual_evo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flyrewheel-postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 250m, memory: 256Mi, ephemeral-storage: 128Mi}
            limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 512Mi}
          startupProbe:
            exec:
              command: [pg_isready, -U, qual_evo, -d, qual_evo]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -U, qual_evo, -d, qual_evo]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, qual_evo, -d, qual_evo]
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flyrewheel-postgres-data
        - name: run
          emptyDir: {sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-worker
spec:
  podSelector:
    matchLabels:
      flyrewheel.io/role: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flyrewheel-worker
      ports:
        - protocol: TCP
          port: 5432
